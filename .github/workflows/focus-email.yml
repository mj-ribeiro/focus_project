name: Focus - send summary by email

on:
  push:
    branches: [main]
    paths:
      - "output/focus/focus_*.html"
  workflow_dispatch:
    inputs:
      force:
        description: "Generate the HTML even if the latest text file is stale. Use only for testing."
        required: false
        default: false
        type: boolean

jobs:
  send:
    name: Send summary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: python -m pip install -r requirements.txt

      - name: Generate Focus HTML summary if missing
        run: |
          if compgen -G "output/focus/focus_*.html" > /dev/null; then
            echo "Focus HTML summary already exists."
          elif [ "${{ inputs.force }}" = "true" ]; then
            python src/gerar_resumo_html.py --force
          else
            python src/gerar_resumo_html.py
          fi

      - name: Send Focus summary email
        env:
          FOCUS_SMTP_USER: ${{ secrets.FOCUS_SMTP_USER }}
          FOCUS_SMTP_APP_PASSWORD: ${{ secrets.FOCUS_SMTP_APP_PASSWORD }}
          FOCUS_EMAIL_DEST: ${{ secrets.FOCUS_EMAIL_DEST }}
          FOCUS_EMAIL_BCC: ${{ secrets.FOCUS_EMAIL_BCC }}
        run: python src/send_email.py
